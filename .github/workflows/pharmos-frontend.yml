name: PharmOS Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'pharmos-frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy PharmOS Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pharmos-frontend/package-lock.json

      - name: Install dependencies
        working-directory: pharmos-frontend
        run: npm ci

      - name: Build
        working-directory: pharmos-frontend
        run: npm run build
        env:
          VITE_API_URL: https://kaycare-prod-api.azurewebsites.net

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        continue-on-error: true
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PHARMOS }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: pharmos-frontend
          output_location: dist
          skip_app_build: true
