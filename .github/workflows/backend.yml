name: Backend — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '*.sln'
      - 'Dockerfile'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: CI_TestPass123!
          POSTGRES_DB: KayCareTestDb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore KayCare.sln

      - name: Build
        run: dotnet build KayCare.sln --configuration Release --no-restore

      - name: Run tests
        env:
          TEST_DB_CONNECTION: "Host=localhost;Port=5432;Database=KayCareTestDb;Username=postgres;Password=CI_TestPass123!"
        run: dotnet test src/KayCare.Tests --configuration Release --no-build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service kaycare-api --detach
