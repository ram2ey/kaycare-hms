## render.yaml — KayCare HMS Blueprint
## Provisions: Postgres DB + ASP.NET Core API (Docker) + React Static Site
## Usage: render.com → New → Blueprint → connect repo → fill in secrets

databases:
  - name: kaycare-hms-db
    databaseName: kaycare_hms
    user: kaycare_user
    plan: free          # ⚠ Free tier expires after 90 days — upgrade to starter ($7/mo) for production

services:
  # ── ASP.NET Core 8 API (Docker Web Service) ───────────────────────────────
  - type: web
    name: kaycare-hms-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "true"

      # Render auto-injects the internal Postgres connection string — no manual entry needed
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: kaycare-hms-db
          property: connectionString

      # JWT — set in Render dashboard (min 32 random chars)
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: KayCare
      - key: Jwt__Audience
        value: KayCare

      # Supabase Storage — set in Render dashboard (DB not used; storage only)
      - key: Supabase__Url
        sync: false
      - key: Supabase__ServiceKey
        sync: false

      # CORS — set to your Render static site URL after first deploy
      # e.g. https://kaycare-hms-frontend.onrender.com
      - key: Cors__AllowedOrigins__0
        sync: false

      # HL7 — set in Render dashboard. Startup refuses to run if either is left as the
      # appsettings.json placeholder value.
      - key: Hl7__WebhookApiKey
        sync: false
      - key: Hl7__MllpSharedSecret
        sync: false

      # Field-level PII encryption key (DB17/DB18) — base64-encoded, must decode to exactly 32
      # bytes (AES-256). Startup refuses to run if left as the appsettings.json placeholder value
      # or if it doesn't decode to 32 bytes. Generate with e.g.
      # `openssl rand -base64 32` in a real deployment.
      - key: Encryption__Key
        sync: false

      # Demo/sales data seeding — leave "false" for real tenant deployments. Only flip to
      # "true" for a deliberately-provisioned demo/sales instance.
      - key: Seeding__EnableDemoData
        value: "false"

  # ── React / Vite Frontend (Static Site) ───────────────────────────────────
  - type: web
    name: kaycare-hms-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Set to your Render API URL, e.g. https://kaycare-hms-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
    routes:
      # Rewrite all paths to index.html for React Router (SPA)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Keep in sync with the CONTENT_SECURITY_POLICY constant in frontend/vite.config.ts, which
      # exists so this can be verified locally via `npm run preview` before every real deploy —
      # this is what actually takes effect once deployed, Vite's own dev/preview servers don't
      # serve traffic here. See that constant's comment for the reasoning per directive.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
